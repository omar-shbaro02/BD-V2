name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vai_bd_test
          POSTGRES_USER: vai_bd
          POSTGRES_PASSWORD: vai_bd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vai_bd -d vai_bd_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://vai_bd:vai_bd@localhost:5432/vai_bd_test
      EXTERNAL_EXECUTION_ALLOWED: "false"
      OPENAI_AGENTS_DISABLE_TRACING: "1"
      TRACE_INCLUDE_SENSITIVE_DATA: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff format --check src tests scripts migrations
      - run: python -m ruff check src tests scripts migrations
      - run: python -m mypy
      - run: python scripts/hardening_scan.py
      - run: python -m pytest
