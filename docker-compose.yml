services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vai_bd
      POSTGRES_USER: vai_bd
      POSTGRES_PASSWORD: vai_bd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai_bd -d vai_bd"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - vai_bd_postgres_data:/var/lib/postgresql/data

volumes:
  vai_bd_postgres_data:

